[package]
name = "idea-capture"
version = "0.1.0"
edition = "2021"

[lib]
name = "idea_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
